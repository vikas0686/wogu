name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the core reactor (wogu-api .. wogu-maven-plugin)
        run: mvn -B clean verify

      - name: Install WoGu jars to the local Maven repository
        run: mvn -B install -DskipTests
        # Needed so wogu-gradle-plugin can resolve io.wogu:* from mavenLocal();
        # see CONTRIBUTING.md.

      - name: Verify the sample project fails as designed
        run: |
          if mvn -B -f sample-temporal-project verify; then
            echo "::error::sample-temporal-project was expected to fail WoGu validation, but the build passed."
            exit 1
          fi
          echo "sample-temporal-project failed validation as expected."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wogu-gradle-plugin
        working-directory: wogu-gradle-plugin
        run: ./gradlew build --no-daemon

      - name: Upload WoGu HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wogu-report
          path: sample-temporal-project/target/wogu/index.html
          if-no-files-found: warn
