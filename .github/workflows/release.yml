name: Release

# Fires only when a release tag (release-0.1.1, release-1.0.0, ...) is pushed. Ordinary
# pushes to main and pull requests stay on ci.yml; this workflow never runs on those.
on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write # required for the final job to create a GitHub Release

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Confirm the tag matches the project version
        # wogu-gradle-plugin reads its version from the same <revision> property (see its
        # build.gradle.kts), so checking the pom's resolved project.version is sufficient
        # for both build systems.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#release-}"
          POM_VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          echo "tag=$TAG_VERSION pom=$POM_VERSION"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version $TAG_VERSION) does not match the <revision> property in pom.xml ($POM_VERSION). Bump it and push a new commit before retagging."
            exit 1
          fi

      - name: Build and test the core reactor (wogu-api .. wogu-maven-plugin)
        run: mvn -B clean verify

      - name: Install WoGu jars to the local Maven repository
        run: mvn -B install -DskipTests

      - name: Verify the sample project fails as designed
        run: |
          if mvn -B -f sample-temporal-project verify; then
            echo "::error::sample-temporal-project was expected to fail WoGu validation, but the build passed."
            exit 1
          fi
          echo "sample-temporal-project failed validation as expected."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wogu-gradle-plugin
        working-directory: wogu-gradle-plugin
        run: ./gradlew build --no-daemon

  publish-maven-central:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    # Configure this environment under Settings > Environments if you want a required
    # reviewer to approve before this job (and the Central upload it performs) runs.
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy signed artifacts to Maven Central
        # autoPublish=false (see root pom.xml) means this uploads and validates a staged
        # deployment but leaves it pending a manual review-and-publish click in
        # https://central.sonatype.com/publishing/deployments
        run: mvn -B -Prelease clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Collect release jars
        run: |
          mkdir -p release-artifacts/maven
          find . -path '*/target/*.jar' \
            -not -name '*-sources.jar' \
            -not -name '*-javadoc.jar' \
            -exec cp {} release-artifacts/maven/ \;

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: maven-release-jars
          path: release-artifacts/maven/*.jar

  publish-gradle-plugin:
    name: Publish Gradle plugin to the Plugin Portal
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install WoGu jars to the local Maven repository
        # This job runs on its own fresh runner (in parallel with publish-maven-central),
        # so mavenLocal() starts empty here, and the version being released is at best a
        # *pending* Central deployment (autoPublish=false) — not yet resolvable from
        # mavenCentral() either. Build and install the reactor locally so
        # wogu-gradle-plugin's own dependency resolution (see its build.gradle.kts) has
        # something to find.
        run: mvn -B install -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish plugin to the Gradle Plugin Portal
        working-directory: wogu-gradle-plugin
        run: ./gradlew publishPlugins --no-daemon
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: gradle-plugin-jar
          path: wogu-gradle-plugin/build/libs/*.jar

  github-release:
    name: Create GitHub Release
    needs: [publish-maven-central, publish-gradle-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Maven release jars
        uses: actions/download-artifact@v4
        with:
          name: maven-release-jars
          path: release-artifacts/maven

      - name: Download Gradle plugin jar
        uses: actions/download-artifact@v4
        with:
          name: gradle-plugin-jar
          path: release-artifacts/gradle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/maven/*.jar
            release-artifacts/gradle/*.jar
          generate_release_notes: true
