id: WG004
type: forbidden-method
title: Math.random() inside Workflow
category: Determinism
severity: ERROR
engine: Temporal Java SDK
since: 1.0.0
documentation: https://github.com/vikas0686/wogu/tree/main/docs/rules/WG004.md

description: >-
  Math.random() is a source of non-deterministic randomness. Temporal workflows replay
  workflow code from event history, so generating a new random value during replay may
  produce a different result than the original execution and cause workflow execution to
  diverge from recorded history.

replacement: >-
  Use Workflow.newRandom() (or another Temporal-provided deterministic alternative)
  instead. It is seeded from workflow history, so it produces the same sequence of values
  on every replay.

methods:
  - java.lang.Math.random

suppressedContexts:
  - SIDE_EFFECT
