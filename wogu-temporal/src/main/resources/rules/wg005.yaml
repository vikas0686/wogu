id: WG005
type: forbidden-method
title: java.util.Random inside Workflow
category: Determinism
severity: ERROR
engine: Temporal Java SDK
since: 1.0.0
documentation: https://github.com/vikas0686/wogu/tree/main/docs/rules/WG005.md

description: >-
  java.util.Random is a source of non-deterministic randomness unless explicitly seeded
  with a fixed value. Temporal workflows replay workflow code from event history, so
  constructing or drawing from a Random instance during replay may produce a different
  result than the original execution and cause workflow execution to diverge from
  recorded history.

replacement: >-
  Use Workflow.newRandom() (or another Temporal-provided deterministic alternative)
  instead. It is seeded from workflow history, so it produces the same sequence of values
  on every replay.

methods:
  - java.util.Random.nextInt
  - java.util.Random.nextLong
  - java.util.Random.nextDouble
  - java.util.Random.nextBoolean

constructors:
  - java.util.Random

suppressedContexts:
  - SIDE_EFFECT
