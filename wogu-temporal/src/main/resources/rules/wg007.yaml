id: WG007
type: forbidden-method
title: SecureRandom inside Workflow
category: Determinism
severity: ERROR
engine: Temporal Java SDK
since: 0.3.0
documentation: https://github.com/vikas0686/wogu/tree/main/docs/rules/WG007.md

description: >-
  SecureRandom is a source of non-deterministic, cryptographically strong randomness.
  Temporal workflows replay workflow code from event history, so constructing or drawing
  from a SecureRandom instance during replay may produce a different result than the
  original execution and cause workflow execution to diverge from recorded history.

replacement: >-
  Use Workflow.newRandom() (or another Temporal-provided deterministic alternative)
  instead. It is seeded from workflow history, so it produces the same sequence of values
  on every replay. If cryptographic randomness is genuinely required, generate it inside
  an Activity instead.

methods:
  - java.security.SecureRandom.nextBytes
  - java.security.SecureRandom.nextInt

constructors:
  - java.security.SecureRandom
