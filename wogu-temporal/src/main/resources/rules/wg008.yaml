id: WG008
type: forbidden-method
title: System.getenv() inside Workflow
category: Determinism
severity: ERROR
engine: Temporal Java SDK
since: 1.0.0
documentation: https://github.com/vikas0686/wogu/tree/main/docs/rules/WG008.md

description: >-
  Environment variables may differ between workflow replay executions (a different worker
  host, a redeployed environment, a changed configuration). Reading them directly inside
  workflow code can cause workflow execution to diverge from recorded history.

replacement: >-
  Read configuration outside the workflow or via an Activity.

methods:
  - java.lang.System.getenv
